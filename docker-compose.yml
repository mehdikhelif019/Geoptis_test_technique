services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: geoptis
      POSTGRES_PASSWORD: geoptis_test_2026
      POSTGRES_DB: restaurants_db
    ports:
      - "5433:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: